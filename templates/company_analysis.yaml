template_id: company_analysis
title: 年报分析
sections:
  - name: 公司概况
    questions:
      - 公司的基本信息、注册地与主营定位是什么？
      - 报告期内公司整体经营情况如何概述？
    keywords:
      - 公司概况
      - 公司简介
      - 公司信息
      - 注册地址
      - 股票简称
      - 经营情况讨论与分析
    section_hints:
      - 公司简介和主要财务指标
      - 公司基本情况
      - 公司简介
      - 公司信息
      - 注册地址
      - 股票简称
  - name: 主营业务
    questions:
      - 公司主营业务构成与主要产品或服务是什么？
      - 收入结构或分部情况有哪些要点？
    keywords:
      - 主营业务
      - 业务概要
      - 收入构成
    section_hints:
      - 管理层讨论与分析
      - 主营业务
      - 业务概要
  - name: 财务表现
    questions:
      - 营业收入、净利润等关键财务数据及同比变化如何？
      - 毛利率、现金流或资产负债方面有哪些要点？
    keywords:
      - 营业收入
      - 净利润
      - 财务指标
      - 资产负债率
      - 资产总额
      - 负债总额
      - 合并资产负债表
      - 资产总计
      - 负债合计
    section_hints:
      - 主要会计数据和财务指标
      - 主要财务指标
      - 财务指标
      - 资产负债率
      - 资产总额
      - 负债总额
      - 合并资产负债表
      - 资产总计
      - 负债合计
  - name: 风险因素
    questions:
      - 公司披露的主要风险因素有哪些？
      - 哪些风险与经营或财务直接相关？
    keywords:
      - 风险因素
      - 可能面对的风险
    section_hints:
      - 可能面对的风险
      - 风险因素
      - 公司未来发展的展望
  - name: 结论
    questions:
      - 综合前述信息，可归纳的经营结论与关注点是什么？
    keywords:
      - 经营情况
      - 未来发展
    section_hints:
      - 经营情况讨论与分析
      - 管理层讨论与分析
